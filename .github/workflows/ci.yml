name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/blast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=controller -t take-my-load-controller:test .
      - run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=worker -t take-my-load-worker:test .
      - run: docker compose config --quiet
