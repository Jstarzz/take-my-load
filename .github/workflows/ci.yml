name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            echo
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: tml
          POSTGRES_USER: tml
          POSTGRES_PASSWORD: tml-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tml -d tml"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply control-plane schema
        shell: bash
        run: |
          container_id="$(docker ps --filter ancestor=postgres:18.6-alpine --format '{{.ID}}' | head -n1)"
          test -n "$container_id"
          docker exec -i "$container_id" psql -v ON_ERROR_STOP=1 -U tml -d tml < deploy/platform/postgres/init/001-schema.sql
      - name: Run PostgreSQL integration tests
        env:
          TML_TEST_DATABASE_URL: postgres://tml:tml-test@127.0.0.1:5432/tml?sslmode=disable
        run: go test -tags=integration ./internal/persistence/postgres -count=1 -v

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine/blast
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke test fixed-rate HTTP execution
        shell: bash
        run: |
          python3 -m http.server 18080 --bind 127.0.0.1 >/tmp/tml-http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          summary="$(cargo run --quiet -- run --target http://127.0.0.1:18080/ --rps 100 --duration-seconds 1 --concurrency 32)"
          echo "$summary"
          python3 - "$summary" <<'PY'
          import json
          import sys

          summary = json.loads(sys.argv[1])
          assert summary["requested_rps"] == 100, summary
          assert summary["started"] > 0, summary
          assert summary["completed"] > 0, summary
          assert summary["status_2xx"] > 0, summary
          assert summary["latency_samples"] > 0, summary
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: engine/blast/Cargo.lock
          if-no-files-found: error

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/Dockerfile --build-arg SERVICE=controller -t take-my-load-controller:test .
      - run: docker build -f deploy/docker/Dockerfile.worker -t take-my-load-worker:test .
      - name: Verify packaged blast engine
        run: docker run --rm --entrypoint /usr/local/bin/tml-blast take-my-load-worker:test --capabilities
      - run: docker compose config --quiet
      - name: Validate full platform compose
        run: docker compose -f compose.yaml -f deploy/platform/compose.yaml config --quiet
      - name: Validate platform shell scripts
        run: |
          sh -n deploy/platform/postgres/init/002-replication.sh
          sh -n deploy/platform/postgres/replica-entrypoint.sh
          sh -n deploy/platform/pgbouncer/entrypoint.sh
